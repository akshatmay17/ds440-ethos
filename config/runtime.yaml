# Ethos Runtime Environment Configuration
version: "1.0"
runtime:
  default_backend: "isolated_process"  # options: isolated_process, docker, gvisor
  timeout_seconds: 300
  memory_limit_mb: 2048
  cpu_quota: 2.0

storage:
  snapshot_dir: ".ethos/snapshots"
  max_snapshots_per_session: 50
  prune_strategy: "lru"

telemetry:
  sink: "jsonl"
  log_dir: ".ethos/telemetry"
  log_level: "INFO"
  record_full_traces: true
