    // CHAPTER DATA STORE
    const chapters = [
      {
        id: "1-overview",
        num: "1",
        title: "Overview & Research Program",
        sources: ["README.md", "src/lib.rs", "src/models.rs"],
        content: `
          <h1>1. Overview & Research Program</h1>
          <div class="source-pills">
            <div class="source-pills-title">Relevant Source Files</div>
            <div class="pills-list">
              <span class="file-pill">README.md</span>
              <span class="file-pill">src/lib.rs:1-35</span>
              <span class="file-pill">src/models.rs:1-120</span>
            </div>
          </div>
          <p>
            In modern autonomous AI agent systems, the <strong>Agent-Computer Interface (ACI)</strong> represents the single largest capability multiplier. Frontier and open-weight models executing against raw, unconstrained operating system shells perform poorly due to context window pollution (repetitive <code>cd</code>, <code>ls</code>, and verbose error traces), lack of structural editing primitives, and irreversible file modifications.
          </p>
          <p>
            Simultaneously, agent deployments suffer from a fatal vulnerability: <strong>untrusted content ingestion without provenance tracking</strong>. When an agent reads external web scrapes, third-party emails, issues, or tool responses, adversarial instructions embedded within that data (indirect prompt injection) seamlessly flow into the model context. Because standard runtimes do not distinguish between operator instructions and untrusted data, the agent's privileged capabilities—such as file deletion, secret reading, and network socket operations—are turned into execution vectors for an external adversary.
          </p>
          
          <div class="callout callout-note">
            <strong>Core Thesis:</strong> Decouple safety enforcement from model compliance. Safety must be enforced deterministically at the runtime boundary: if a tool call derives its inputs from an untrusted source, the runtime blocks the operation regardless of whether the model believed the adversarial instruction.
          </div>

          <h2>1.1 Heilmeier Formulation</h2>
          <table>
            <thead>
              <tr><th>Heilmeier Question</th><th>Ethos Implementation</th></tr>
            </thead>
            <tbody>
              <tr><td><strong>What are you trying to do?</strong></td><td>Build an instrumented sandbox execution environment and agent-computer interface that tracks the provenance of every byte ingested by an AI agent and mechanically enforces safety boundaries on privileged tools.</td></tr>
              <tr><td><strong>How is it done today?</strong></td><td>Uninstrumented Docker containers with full network access or prompt-level instructions ("Never execute commands in emails"), which fail reliably against indirect injections.</td></tr>
              <tr><td><strong>What is new in your approach?</strong></td><td>Pure-Rust zero-cost bitmask taint tracking, lattice propagation algebra, and sub-millisecond local snapshot/rewind checkpointing.</td></tr>
              <tr><td><strong>Who cares?</strong></td><td>Enterprise developers deploying coding, research, and IT automation agents (Microsoft Copilot, Devin, Claude Computer Use).</td></tr>
              <tr><td><strong>What are the mid-term / final exams?</strong></td><td>Mid-term: 100% defense on M365 indirect injection suite. Final: Publication of Paper 1 (Capability ACI Curve) and Paper 2 (Taint as the Trust Boundary).</td></tr>
            </tbody>
          </table>

          <h2>1.2 Dual Research Papers</h2>
          <h3>Paper 1 (Capability — The ACI Curve)</h3>
          <p>
            Evaluates model performance while holding model weights fixed (e.g. <code>qwen2.5-coder</code>, <code>claude-3-5-sonnet</code>) across four operational conditions:
          </p>
          <ul>
            <li><strong>Condition A (Raw Shell)</strong>: Uninstrumented bash shell without observation channels.</li>
            <li><strong>Condition B (Typed Tools)</strong>: Structured, typed tools (<code>read</code>, <code>write</code>, <code>exec</code>).</li>
            <li><strong>Condition C (Time-Travel)</strong>: Structured tools with Snapshot-Rewind checkpointing.</li>
            <li><strong>Condition D (Full ACI)</strong>: Full harness with active observation and provenance awareness surfaced to model context.</li>
          </ul>

          <h3>Paper 2 (Defense — Taint as the Trust Boundary)</h3>
          <p>
            Measures vulnerability and mitigation rates across a 7-class adversarial corpus comparing baseline models, prompt hardening, Ethos boundary policy, and multi-layered defense-in-depth.
          </p>
        `
      },
      {
        id: "2-core-architecture",
        num: "2",
        title: "Core Architecture & Type System",
        sources: ["src/models.rs", "src/api/routes.rs", "src/cli/mod.rs"],
        content: `
          <h1>2. Core Architecture & Type System</h1>
          <div class="source-pills">
            <div class="source-pills-title">Relevant Source Files</div>
            <div class="pills-list">
              <span class="file-pill">src/models.rs:7-121</span>
              <span class="file-pill">src/api/routes.rs:1-120</span>
              <span class="file-pill">src/cli/mod.rs:1-90</span>
            </div>
          </div>
          <p>
            Ethos is structured as a layered runtime. The API Gateway routes operator commands, the ACI Layer parses typed tool calls and coordinates with Containment Walls, the Taint Engine evaluates policy and propagates provenance, and the Sandbox Runtime isolates disk and execution operations.
          </p>

          <h2>2.1 Layered Architecture Diagram</h2>
          <div class="mermaid-box">
            <pre class="mermaid">
graph TD
    User["Operator / Autonomous Agent (CLI / TUI / REST / SDK)"] --> Gateway["Axum API Gateway & CLI Dispatcher (src/api/routes.rs, src/cli/mod.rs)"]
    Gateway --> ACILayer["ACI Layer: Typed Tool Harness & AgentLoop (src/aci/harness.rs, src/aci/agent_loop.rs)"]
    ACILayer --> Walls["Containment Walls (src/walls/ promptinject, estop, ouroboros, halluscan)"]
    ACILayer --> TaintLayer["Taint Engine: Ledger & Boundary Policy (src/taint/engine.rs, src/taint/policy.rs)"]
    TaintLayer --> Runtime["Sandbox Runtime: LocalIsolatedRuntime (src/runtime/base.rs)"]
    Runtime --> Storage["Persistence & Telemetry: PostgresStore & JSONL (src/store/postgres.rs, src/metrics/mod.rs)"]
            </pre>
          </div>

          <h2>2.2 End-to-End Execution Sequence</h2>
          <div class="mermaid-box">
            <pre class="mermaid">
sequenceDiagram
    autonumber
    participant Agent as Agent / LLM
    participant ACI as ACI Harness
    participant Walls as Containment Walls
    participant Taint as Taint Engine
    participant Runtime as Sandbox Runtime
    participant Store as Telemetry / Postgres

    Agent->>ACI: invoke_tool(name, args)
    ACI->>Walls: pre_check(tool, args) [PromptInject, Ouroboros, HalluScan]
    alt Wall Tripped
        Walls-->>ACI: Intercept & Trip E-Stop
        ACI-->>Agent: ToolResult(status: "BLOCKED_BY_POLICY", error: "Wall violation")
    else Wall Clear
        ACI->>Taint: evaluate_policy(action, referenced_resources)
        alt Policy Blocked (Tainted input -> Privileged Action)
            Taint-->>ACI: PolicyDecision(allowed: false, rule_id: "RULE-001")
            ACI->>Store: log_event("POLICY_BLOCK", action, details)
            ACI-->>Agent: ToolResult(status: "BLOCKED_BY_POLICY", reason: "...")

            ACI->>Store: log_event("TOOL_EXEC" / "TOOL_WRITE", action, details)
            ACI-->>Agent: ToolResult(status: "SUCCESS", output: processed_data, provenance: record)
        end

          <h2>3.2 Output Windowing & Context Compression</h2>
          <p>
            Large build outputs or test results frequently exhaust agent context windows. The ACI Harness implements folding windowing (<code>src/aci/harness.rs:278</code>) preserving the head and tail lines:

          <pre><code>pub fn fold_output(&self, text: &str, head_lines: usize, tail_lines: usize) -> String {
    let lines: Vec<&str> = text.lines().collect();
    if lines.len() <= head_lines + tail_lines {
        return text.to_string();
    }
    format!(
        "{}\\n\\n... [{} lines truncated to preserve model context] ...\\n\\n{}",
        head.join("\\n"), lines.len() - head_lines - tail_lines, tail.join("\\n")
    )

          <p>
            The Taint Engine maintains a hash-indexed ledger $\\mathcal{L}: \\text{ResourceID} \\to \\text{ProvenanceRecord}$. Every file read, network scrape, and user message is tagged with trust levels and custody chains.
          </p>

          <h2>4.1 Propagation Lattice Algebra</h2>
          <p>
            When an agent generates or modifies resource $T$ using sources $S = \\{s_1, s_2, \\dots, s_k\\}$:
          </p>
          <ul>
            <li><strong>Lattice Join</strong>: $\\text{TrustLevel}(T) = \\max_{s \\in S} \\left( \\text{TrustLevel}(s) \\right)$</li>
            <li><strong>Chain of Custody</strong>: $\\text{ChainOfCustody}(T) = \\bigcup_{s \\in S} \\text{ChainOfCustody}(s) \\cup \\{ \\text{source\\_id}(s) \\}$</li>
            <li><strong>Tag Assignment</strong>: $\\text{Tag}(T) = \\text{Derived}$ if any source was tracked, else $\\text{Internal}$.</li>
          </ul>

          <h2>4.2 Security Boundary Profiles</h2>
          <table>
            <thead>
              <tr><th>Profile</th><th>Mode</th><th>Enforcement Behavior</th></tr>
            </thead>
            <tbody>
              <tr><td><code>Standard</code></td><td>Balanced Protection</td><td>Blocks privileged tools (<code>network_egress</code>, <code>rm</code>, <code>curl</code>) when input sources carry <code>TrustLevel >= Untrusted</code>.</td></tr>
              <tr><td><code>Strict</code></td><td>Zero-Trust</td><td>Blocks all privileged tools <strong>AND all file writes</strong> derived from untrusted inputs (<code>TAINT-STRICT-WRITE</code>).</td></tr>
              <tr><td><code>AuditOnly</code></td><td>Observation Mode</td><td>Records full taint telemetry and policy violations without blocking, enabling empirical research on attack trajectories.</td></tr>
            </tbody>
          </table>

          <h2>4.3 Sensitive Paths & Egress Allowlisting</h2>
          <p>
            Direct reads of sensitive configuration files (<code>.env</code>, <code>id_rsa</code>, <code>/etc/shadow</code>) are immediately blocked with rule <code>TAINT-PATH-SECRET</code>. Network tools (<code>curl</code>, <code>fetch</code>) are checked against <code>config.network_allowlist</code>: unallowlisted requests carrying tainted inputs trigger rule <code>TAINT-NETWORK-ALLOWLIST</code>.
          </p>
        `

              <tr><td><code>GET</code></td><td><code>/v1/metrics</code></td><td>System metrics summary (steps, wall trips, sandboxes).</td></tr>
              <tr><td><code>GET</code></td><td><code>/v1/taint/graph</code></td><td>Active provenance DAG nodes and edges.</td></tr>
              <tr><td><code>GET</code></td><td><code>/v1/lab/scenarios</code></td><td>List Attack Lab scenarios.</td></tr>
              <tr><td><code>POST</code></td><td><code>/v1/lab/execute</code></td><td>Simulate attack scenario with live trace logging.</td></tr>
            </tbody>
          </table>
        `
      }
    ];

    let currentChapterIndex = 0;

    function renderNav() {
      const tree = document.getElementById('navTree');
      tree.innerHTML = '';

      chapters.forEach((ch, idx) => {
        const li = document.createElement('li');
        li.innerHTML = `
          <a class="nav-item ${idx === currentChapterIndex ? 'active' : ''}" onclick="selectChapter(${idx})">
            <span class="sec-num">${ch.num}.0</span>
            <span>${ch.title}</span>
          </a>
        `;
        tree.appendChild(li);
      });
    }

    function selectChapter(idx) {
      currentChapterIndex = idx;
      renderNav();
      renderContent();
      document.getElementById('mainPanel').scrollTop = 0;
    }

    function renderContent() {
      const ch = chapters[currentChapterIndex];
      const view = document.getElementById('contentView');

      const prev = currentChapterIndex > 0 ? chapters[currentChapterIndex - 1] : null;
      const next = currentChapterIndex < chapters.length - 1 ? chapters[currentChapterIndex + 1] : null;

      let pagerHtml = '<div class="pager">';
      if (prev) {
        pagerHtml += `
          <a class="pager-btn" onclick="selectChapter(${currentChapterIndex - 1})">
            <span class="pager-label">← Previous</span>
            <span class="pager-title">${prev.num}.0 ${prev.title}</span>
          </a>
        `;
      } else {
        pagerHtml += '<div></div>';
      }
      if (next) {
        pagerHtml += `
          <a class="pager-btn" style="text-align:right;" onclick="selectChapter(${currentChapterIndex + 1})">
            <span class="pager-label">Next →</span>
            <span class="pager-title">${next.num}.0 ${next.title}</span>
          </a>
        `;
      }
      pagerHtml += '</div>';

      view.innerHTML = `
        <div class="breadcrumbs">
          <span>ethos</span>
          <span>/</span>
          <span>Documentation</span>
          <span>/</span>
          <span style="color:var(--text);">${ch.title}</span>
        </div>
        ${ch.content}
        ${pagerHtml}
      `;

      mermaid.run({
        querySelector: '.mermaid'
      });
    }

    function filterNav() {
      const q = document.getElementById('filterInput').value.toLowerCase();
      const items = document.querySelectorAll('#navTree .nav-item');
      items.forEach(el => {
        const text = el.innerText.toLowerCase();
        el.parentElement.style.display = text.includes(q) ? '' : 'none';
      });
    }

    function openSearch() {
      document.getElementById('searchModal').classList.add('open');
      document.getElementById('modalSearchInput').focus();
      renderSearchResults();
    }

    function closeSearch(e) {
      document.getElementById('searchModal').classList.remove('open');
    }

    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        openSearch();
      }
      if (e.key === 'Escape') {
        closeSearch();
      }
    });

    function renderSearchResults() {
      const q = document.getElementById('modalSearchInput').value.toLowerCase().trim();
      const container = document.getElementById('searchResults');
      container.innerHTML = '';

      if (!q) {
        chapters.forEach((ch, idx) => {
          const div = document.createElement('div');
          div.className = 'search-result-item';
          div.onclick = () => { selectChapter(idx); closeSearch(); };
          div.innerHTML = `
            <div class="result-title">${ch.num}.0 ${ch.title}</div>
            <div class="result-snippet">Chapter overview & key source files</div>
          `;
          container.appendChild(div);
        });
        return;
      }

      const hits = [];
      chapters.forEach((ch, idx) => {
        if (ch.title.toLowerCase().includes(q) || ch.content.toLowerCase().includes(q)) {
          hits.push({ ch, idx });
        }
      });

      if (hits.length === 0) {
        container.innerHTML = '<div style="padding:16px; color:var(--text-dim); text-align:center;">No matching documentation found.</div>';
        return;
      }

      hits.forEach(({ ch, idx }) => {
        const div = document.createElement('div');
        div.className = 'search-result-item';
        div.onclick = () => { selectChapter(idx); closeSearch(); };
        div.innerHTML = `
          <div class="result-title">${ch.num}.0 ${ch.title}</div>
          <div class="result-snippet">Found match in ${ch.title}</div>
        `;
        container.appendChild(div);
      });
    }

    // Initialize
    renderNav();
    renderContent();
  </script>
</body>
</html>
