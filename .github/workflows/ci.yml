name: CI

on:
  push:
    branches: ["main", "harsh-dev"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test Rust Core & Harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo Check
        run: cargo check --all-targets

      - name: Run Tests
        run: cargo test --verbose

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate evaluation scenarios
        run: python3 scripts/validate_scenarios.py

      - name: Validate Security Evaluation Sampling
        run: python3 -m unittest discover -s tests -p test_security_eval.py

      - name: Validate Attack Outcome Accounting
        run: python3 -m unittest discover -s tests -p test_attack_campaign.py

      - name: Validate MCP Lab Transport Failure Handling
        run: python3 -m unittest discover -s tests -p test_mcp_public_stress.py

      - name: Verify Disposable Container Boundary
        run: |
          docker pull alpine@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
          python3 scripts/container_stress.py --output reports/container_ci.json

      - name: Eval harness smoke (scripted driver, no network)
        run: |
          set -e
          cargo run --quiet --bin ethos -- eval --dataset attacks --provider scripted \
            --condition full --output /tmp/smoke_attacks.json
          cargo run --quiet --bin ethos -- eval --dataset capability --provider scripted \
            --output /tmp/smoke_cap.json
          python3 scripts/make_tables.py --include-scripted /tmp/smoke_attacks.json >/dev/null

  sarif:
    name: Static Analysis (SARIF)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install clippy-sarif & sarif-fmt
        uses: taiki-e/install-action@v2
        with:
          tool: clippy-sarif,sarif-fmt

      # Part A: standard Rust lints (Clippy) -> SARIF
      # Fall back to a minimal valid SARIF when clippy dies early, so the
      # upload step never receives an empty/missing file.
      - name: Clippy -> SARIF
        run: |
          set -o pipefail
          if ! cargo clippy --all-targets --message-format=json \
            | clippy-sarif | tee clippy.sarif | sarif-fmt; then
            if [ ! -s clippy.sarif ]; then
              echo '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"clippy"}},"results":[]}]}' > clippy.sarif
            fi
          fi
        continue-on-error: true

      # Part B: Ethos's own prompt-injection scanner -> SARIF.
      # Benchmark data, red-team tests, reports and the scanner's own pattern
      # source contain attack strings on purpose, so they are excluded.
      # Guard code and fixtures under src/ quote attack strings deliberately
      # (synthetic engine, taint policy docs, CLI help); they are excluded
      # per-file. Remaining hits in top-level markdown are known FPs (mentions
      # of .env / defense descriptions) - kept as the paper's FP data point.
      - name: Ethos injection scan -> SARIF
        run: |
          cargo run --quiet --bin ethos -- scan . --output ethos.sarif \
                           --exclude data --exclude tests --exclude reports --exclude src/walls --exclude docs --exclude scripts \
                           --exclude src/aci/synthetic.rs --exclude src/aci/agent_loop.rs \
                           --exclude src/aci/eval.rs --exclude src/cli/eval_cmd.rs --exclude src/cli/scanner_eval.rs \
                           --exclude src/cli/mod.rs --exclude src/taint/policy.rs \
                           --exclude src/tui/app.rs --exclude src/api/routes.rs \
                           --exclude apps/desktop/ui/app.js

      - name: Archive SARIF reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sarif-reports
          path: "*.sarif"

      # PRs from forks get a read-only token, so only upload for pushes
      # and PRs opened inside the same repository.
      - name: Upload Clippy SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: clippy.sarif
          category: clippy

      - name: Upload Ethos SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ethos.sarif
          category: ethos-promptinject
