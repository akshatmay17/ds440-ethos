name: Linux Release & Packages (Deb + AppImage + CLI)

on:
  # Pushing a v* tag builds all platforms and publishes to GitHub Releases;
  # manual dispatch (with a release_tag input) remains available for ad-hoc builds.
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release Tag (e.g. v0.1.0)"
        required: false
        default: "v0.1.0"
        type: string
      create_release:
        description: "Publish to GitHub Releases"
        required: false
        default: true
        type: boolean
      draft:
        description: "Create as Draft Release"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark as Pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  build-linux:
    name: Build Linux .deb, .AppImage & CLI
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux System Dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri

      - name: Build Core CLI & Daemon (x86_64-unknown-linux-gnu)
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu --bin ethos
          mkdir -p dist/linux
          cp target/x86_64-unknown-linux-gnu/release/ethos dist/linux/ethos
          chmod +x dist/linux/ethos

      - name: Install Tauri CLI
        run: |
          cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build Tauri Desktop (.deb & .AppImage)
        working-directory: apps/desktop
        run: |
          cargo tauri build --target x86_64-unknown-linux-gnu
          BUNDLE_BASE="src-tauri/target/x86_64-unknown-linux-gnu/release/bundle"
          if [ -d "$BUNDLE_BASE" ]; then
            find "$BUNDLE_BASE/deb" -name "*.deb" -exec cp {} ../../dist/linux/ \; 2>/dev/null || true
            find "$BUNDLE_BASE/appimage" -name "*.AppImage" -exec cp {} ../../dist/linux/ \; 2>/dev/null || true
          fi

      - name: Create Portable Tarball & Checksums
        working-directory: dist/linux
        run: |
          tar -czf "ethos-linux-x86_64-cli.tar.gz" ethos
          cp ../../scripts/install_linux.sh install-linux.sh
          chmod +x install-linux.sh
          rm -f SHA256SUMS-linux.txt
          for f in *; do
            if [ -f "$f" ]; then
              sha256sum "$f" >> SHA256SUMS-linux.txt
            fi
          done
          echo "Staged Linux Release Artifacts:"
          ls -lh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ethos-linux-release-x86_64
          path: dist/linux/*
          if-no-files-found: error

      - name: Determine Release Tag
        id: tag_name
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Publish to GitHub Releases
        if: ${{ github.event.inputs.create_release != 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_name.outputs.tag }}
          name: "Ethos ${{ steps.tag_name.outputs.tag }} (Linux Release)"
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: |
            dist/linux/*.deb
            dist/linux/*.AppImage
            dist/linux/*.tar.gz
            dist/linux/SHA256SUMS-linux.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
